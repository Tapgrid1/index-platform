name: CI

on:
  # Branch pushes are covered by the pull_request trigger; listing '**' here as
  # well runs every check twice on any branch with a PR open.
  push:
    branches: [main]
  pull_request:

# A new push makes the in-flight run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build-time only. `prisma generate` reads the URL's shape but never
      # connects, and every page in the app is server-rendered on demand, so no
      # database is reachable — or needed — during a build.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build
